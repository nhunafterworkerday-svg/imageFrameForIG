<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ใส่กรอบรูป</title>
<style>
:root{--bg:#f6f5f2;--fg:#1c1c1a;--card:#fff;--line:#d9d7d0;--acc:#1c1c1a;--acc-fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#f1f0ec;--card:#222221;--line:#3a3a38;--acc:#f1f0ec;--acc-fg:#161615}}
:root[data-theme="dark"]{--bg:#161615;--fg:#f1f0ec;--card:#222221;--line:#3a3a38;--acc:#f1f0ec;--acc-fg:#161615}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Sukhumvit Set","Thonburi",system-ui,sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label.pick{display:block;text-align:center;padding:14px;border:1.5px dashed var(--line);border-radius:12px;cursor:pointer}
input[type=file]{display:none}
.row{margin-top:12px}.row b{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
input[type=range]{width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font:inherit;font-size:14px}
.chip.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
canvas{width:100%;height:auto;border-radius:6px;display:block;background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/16px 16px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-fg);font:inherit;font-weight:600;font-size:16px;margin-top:10px}
.btn:disabled{opacity:.4}
#out img{width:100%;border-radius:6px;-webkit-touch-callout:default}
.hint{font-size:13px;opacity:.7;margin:8px 0 0;text-align:center}
.hide{display:none}
</style>
</head>
<body>
<h1>ใส่กรอบรูป</h1>
<div class="card">
  <label class="pick" for="f">แตะเพื่อเลือกรูปจากคลังภาพ</label>
  <input id="f" type="file" accept="image/*">
</div>
<div class="card hide" id="ctl">
  <canvas id="c"></canvas>
  <div class="row" id="rb"><b><span>ความหนากรอบ</span><span id="bv">5%</span></b><input id="b" type="range" min="0" max="25" step="0.5" value="5"></div>
  <div class="row"><b>สัดส่วนรูป</b><div class="chips" id="ar">
    <button class="chip on" data-v="0">ตามรูป</button><button class="chip" data-v="43">4:3</button><button class="chip" data-v="1">1:1</button><button class="chip" data-v="0.8">4:5</button><button class="chip" data-v="0.5625">9:16</button></div></div>
  <div class="row hide" id="rz"><b><span>ขนาดภาพบนพื้นหลัง</span><span id="zv">90%</span></b><input id="z" type="range" min="30" max="100" step="1" value="90"></div>
  <div class="row"><b>สีกรอบ / พื้นหลัง</b><div class="chips" id="col">
    <button class="chip on" data-v="#ffffff">ขาว</button><button class="chip" data-v="#f3ecdc">ครีม</button><button class="chip" data-v="#111111">ดำ</button></div></div>
  <button class="btn" id="go">สร้างรูปเพื่อบันทึก</button>
</div>
<div class="card hide" id="out">
  <div id="slot"></div>
  <button class="btn" id="share">แชร์ / บันทึกรูป</button>
  <p class="hint">กดปุ่มด้านบน แล้วเลือก “บันทึกรูปภาพ”<br>ถ้าไม่ขึ้น ให้เปิดลิงก์นี้ใน Safari แล้วกดค้างที่รูป</p>
</div>
<script>
var $=function(i){return document.getElementById(i)},img=null,ar=0,col="#ffffff",MAX=4096,blob=null;
var cv=$("c"),ctx=cv.getContext("2d");
function draw(c,x,full){
  var w=img.naturalWidth,h=img.naturalHeight,p=parseFloat($("b").value)/100,b=Math.round(Math.max(w,h)*p);
  var W=w+2*b,H=h+2*b;
  var r=ar===43?(w>=h?4/3:3/4):ar;
  if(r){ var z=parseFloat($("z").value)/100; W=Math.round(Math.max(w/z,h*r/z)); H=Math.round(W/r); }
  var s=full?Math.min(1,MAX/Math.max(W,H)):Math.min(1,1000/Math.max(W,H));
  c.width=Math.round(W*s);c.height=Math.round(H*s);
  x.fillStyle=col;x.fillRect(0,0,c.width,c.height);
  x.drawImage(img,Math.round((W-w)/2*s),Math.round((H-h)/2*s),Math.round(w*s),Math.round(h*s));
}
function upd(){if(!img)return;$("bv").textContent=$("b").value+"%";$("zv").textContent=$("z").value+"%";$("rb").classList.toggle("hide",!!ar);$("rz").classList.toggle("hide",!ar);draw(cv,ctx,false)}
$("f").onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var u=URL.createObjectURL(f),i=new Image();
  i.onload=function(){img=i;$("ctl").classList.remove("hide");$("out").classList.add("hide");upd()};
  i.src=u;
};
$("b").oninput=upd;$("z").oninput=upd;
function chips(id,fn){$(id).onclick=function(e){var t=e.target.closest(".chip");if(!t)return;
  [].forEach.call($(id).children,function(c){c.classList.remove("on")});t.classList.add("on");fn(t.dataset.v);upd()}}
chips("ar",function(v){ar=parseFloat(v)});chips("col",function(v){col=v});
$("go").onclick=function(){
  var c=document.createElement("canvas");draw(c,c.getContext("2d"),true);
  c.toBlob(function(bl){
    blob=bl;$("slot").innerHTML="";
    var im=new Image();im.src=URL.createObjectURL(bl);$("slot").appendChild(im);
    $("out").classList.remove("hide");
    var file=new File([bl],"framed.jpg",{type:"image/jpeg"});
    $("out").scrollIntoView({behavior:"smooth"});
  },"image/jpeg",0.95);
};
$("share").onclick=function(){
  var f=new File([blob],"framed.jpg",{type:"image/jpeg"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}
  }catch(e){}
  window.open(URL.createObjectURL(blob),"_blank");
};
</script>
</body>
</html>
